name: Discord Notification on Push

on:
  push:
    branches:
      - main          # ← Change this to your main branch name (e.g. master, develop), or remove the 'branches:' line to run on ALL branches
    # tags: ['v*']   # Optional: also trigger on version tags like v1.0

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        uses: sarisia/actions-status-discord@v1  # Reliable, actively maintained action (latest as of Jan 2026)
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}  # Your plain webhook URL (no /github)
          
          # This line makes the actual ping happen – replace with your role's mention format
          content: "<@&1466578302566138035>"   # e.g. "<@&123456789012345678>"  – copy your role ID!
          
          # Optional: Add @everyone or multiple mentions, e.g.:
          # content: "<@&123456789012345678> <@&ANOTHER_ROLE_ID> @here"
          
          title: "New Push to ${{ github.repository }} [${{ github.ref_name }}]"
          
          description: |
            **Commit Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.event.head_commit.author.name }} (@${{ github.event.head_commit.author.username }})
            **Time:** ${{ github.event.head_commit.timestamp }}
            **Commit SHA:** ${{ github.event.head_commit.id }}
            **Files Changed:** ${{ github.event.head_commit.added | length }} added, ${{ github.event.head_commit.removed | length }} removed, ${{ github.event.head_commit.modified | length }} modified
            
            [View Commit on GitHub](${{ github.event.head_commit.url }})
          
          color: 0x00ff00     # Green for success pushes; change to 0xff0000 for red if you want failure conditions later
          
          # Optional extras for nicer look
          username: "GitHub Pushes"                # Webhook override name
          avatar_url: https://github.com/${{ github.event.head_commit.author.username }}.png  # Author's GitHub avatar
          # url: "https://github.com/${{ github.repository }}"   # Makes title clickable to repo